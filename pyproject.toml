# ClassifiedSurface type from the triage pre-gate sensors while teams/triage reads
# health's cadence + state. Kill by moving ClassifiedSurface below health, then
# delete this exception.
ignore_imports = [
  "alan.health -> alan.teams.triage_pregate",
]

