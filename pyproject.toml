[project]
name = "alan"
version = "0.1.0"
description = "Self-hosted task workspace"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142.2",
  "idna>=3.20",
  "packaging>=26.3,<27",
  "pip-audit>=2.10.1,<3",
  "pyyaml>=6.0.3",
  "starlette>=1.7.0,<2",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-xdist>=3.8,<4",
  "pytest-cov>=7.1,<8",
  "pytest-asyncio>=1.4.0,<2",
  "hypothesis>=6.168.3,<7",
  "httpx>=0.28.1,<1",
  "ruff>=0.16.10,<1",
  "mypy>=2.4.0,<3",
  "pyright>=1.1.414,<2",
  "bandit[toml]>=1.9.4,<2",
  "vulture>=2.16,<3",
  "lizard>=1.24.0,<2",
  "xenon>=0.9.3,<1",
  "import-linter>=2.15,<3",
  "types-PyYAML>=6.0.12.20260906,<7",
]

[project.scripts]
alan = "alan.__main__:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alan"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["release"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "BLE", "RET", "PT", "ANN"]
ignore = ["S603", "S607", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"alan/__main__.py" = ["E402"]
"tests/**" = ["S101", "S106", "ANN", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pyright]
include = ["alan"]
exclude = ["alan/web", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnreachable = "error"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules", "alan/web"]
skips = ["B404", "B603", "B607"]

[tool.pip-audit]
# PYSEC-2025-183 / CVE-2025-45768: disputed by pyjwt upstream (key length
# is application's responsibility); no fix version exists (every release
# 0.1.1-2.12.1 is flagged); pyjwt is transitive via claude-agent-sdk.
# Refs: https://api.osv.dev/v1/vulns/PYSEC-2025-183 (verified 2026-05-20).
# Revisit when an upstream fix lands or the advisory is withdrawn.
#
# MAL-2026-4750: fastapi 0.136.3 ships an undocumented `fastar>=0.9.0`
# dependency under the [project.optional-dependencies] "standard" group
# (typosquat/dependency-confusion vector). We depend on plain `fastapi`,
# NOT `fastapi[standard]`, so the malicious transitive `fastar` is never
# resolved into our lock. No fixed fastapi release exists yet.
# Refs: https://api.osv.dev/v1/vulns/MAL-2026-4750 (verified 2026-05-26).
# Revisit when fastapi publishes a release with the offending extra dep removed.
ignore-vuln = ["PYSEC-2025-183", "MAL-2026-4750"]

[tool.coverage.run]
source = ["alan"]
omit = ["alan/web/*", "alan/__main__.py", "tests/eval/*"]
branch = true
relative_files = true
parallel = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = '--tb=short -q --cov=alan --cov-branch --cov-report=term-missing --cov-report=xml -n 6 --dist=worksteal --strict-markers --strict-config'
asyncio_mode = "auto"
markers = [
  "slow: long pipeline / e2e tests (deselect with '-m \"not slow\"')",
  "eval: structural eval metrics (deselect with '-m \"not eval\"'); run via 'uv run pytest -m eval'",
]
filterwarnings = [
  "error",
  # starlette 1.3.1's TestClient warns that pairing it with `httpx` (rather than the
  # unreleased `httpx2`) is deprecated; this is test-only — alan/ never imports
  # starlette.testclient. Drop when we migrate the test client to httpx2.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
norecursedirs = ["spikes", "experiments", ".worktrees", ".hypothesis", "release"]

[tool.importlinter]
root_packages = ["alan"]

